name: Platform Baseline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modernization_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d modernization_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "false"
      DATABASE_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/modernization_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Formatting check (ruff)
        run: uv run ruff format --check .

      - name: Linting check (ruff)
        run: uv run ruff check .

      - name: Static type checking (mypy strict)
        run: uv run mypy modernization_platform tests

      - name: Run automated test suite with coverage
        run: |
          uv run pytest --cov=modernization_platform --cov-report=term-missing --cov-report=xml

      - name: Run PostgreSQL integration suite explicitly
        run: uv run pytest tests/integration/db -v

      - name: Verify Rule 1 AST enforcement
        run: uv run pytest tests/unit/test_rule_1_enforcement.py -v
